<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de Thomas 3D</title>
<meta name="description" content="Démonstration 3D animée du test de Thomas : déroulement, test négatif et tests positifs (psoas, droit fémoral).">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1c2430;
    --muted: #5f6b7a;
    --border: #e1e5eb;
    --accent: #1f7a6d;
    --ok: #2e9e6b;
    --bad: #d64545;
    --scene: #eef1f4;
    --floor: #dfe4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --surface: #1b2129;
      --text: #e6eaf0;
      --muted: #9aa5b4;
      --border: #2c3440;
      --accent: #4cc2ae;
      --ok: #4cc28a;
      --bad: #f06b6b;
      --scene: #161b22;
      --floor: #222a34;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; min-height: 480px; }

  #stage { position: relative; flex: 1; min-height: 220px; background: var(--scene); overflow: hidden; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .label {
    position: absolute; transform: translate(-50%, -50%);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: #fff; background: rgba(30, 40, 55, .82);
  }
  .label.ok { background: var(--ok); }
  .label.bad { background: var(--bad); }
  #verdict {
    position: absolute; top: 10px; left: 10px; padding: 6px 12px; border-radius: 8px;
    font-weight: 700; color: #fff; opacity: 0;
  }
  #verdict.ok { background: var(--ok); }
  #verdict.bad { background: var(--bad); }
  #step-badge {
    position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }
  #legend {
    position: absolute; left: 10px; bottom: 10px; display: grid; gap: 4px;
    padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border);
    font-size: 12px; opacity: 0;
  }
  #legend span { display: flex; align-items: center; gap: 6px; }
  #legend i { width: 18px; height: 4px; border-radius: 2px; background: var(--ok); }
  #legend i.bad { background: var(--bad); }
  #hint {
    position: absolute; bottom: 8px; right: 10px; font-size: 12px; color: var(--muted);
    transition: opacity .6s;
  }

  #caption { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 14px; min-height: 104px; }
  #caption h2 { margin: 0 0 2px; font-size: 15px; }
  #caption p { margin: 0; color: var(--muted); }
  #caption .tip { margin-top: 4px; font-size: 13px; }

  #controls { background: var(--surface); border-top: 1px solid var(--border); padding: 8px 12px 10px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row input[type=range] { flex: 1 1 120px; accent-color: var(--accent); }
  button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; cursor: pointer; min-height: 34px;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .icon { min-width: 38px; }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .group .name { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
</style>

<body>
<div id="app">
  <div id="stage">
    <div id="loading">Chargement de la scène 3D…</div>
    <canvas id="scene" aria-label="Animation 3D du test de Thomas"></canvas>
    <div id="labels"></div>
    <div id="verdict"></div>
    <div id="step-badge"></div>
    <div id="legend" aria-hidden="true">
      <span><i id="lg-psoas"></i><b id="lg-psoas-t"></b></span>
      <span><i id="lg-rf"></i><b id="lg-rf-t"></b></span>
    </div>
    <div id="hint">Glisser pour tourner · pincer ou molette pour zoomer</div>
  </div>

  <div id="caption" aria-live="polite">
    <h2 id="cap-title"></h2>
    <p id="cap-text"></p>
  </div>

  <div id="controls">
    <div class="row">
      <button id="play" class="icon" aria-label="Pause">❚❚</button>
      <button id="restart" class="icon" aria-label="Recommencer" title="Recommencer">⟲</button>
      <button id="prev" class="icon" aria-label="Étape précédente" title="Étape précédente">◀</button>
      <button id="next" class="icon" aria-label="Étape suivante" title="Étape suivante">▶</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Avancement de l'animation">
      <button id="speed" title="Vitesse">×1</button>
    </div>
    <div class="row">
      <div class="group" id="modes"><span class="name">Résultat</span></div>
    </div>
    <div class="row">
      <div class="group" id="views"><span class="name">Vue</span></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './lib/OrbitControls.js';

const V3 = THREE.Vector3;
const DEG = Math.PI / 180;

/* =====================================================================
   SCÉNARIO
   Repère : x = longueur de la table (les jambes sont vers +x),
            y = vertical, z = largeur (côté droit du patient vers +z).
   Les angles des segments sont mesurés dans le plan sagittal, en degrés,
   depuis l'horizontale (0° = vers le bout de la table, 90° = vers le haut).
   ===================================================================== */

const TY = 0.75;                               // hauteur du plan de la table
const TABLE = { start: -1.85, end: 0, width: 0.64 };
const HIP = new V3(-0.36, TY + 0.11, 0);       // bassin du patient (articulation de hanche)
const SEG = { thigh: 0.44, shin: 0.43, trunk: 0.50, shoulderUp: 0.46, upperArm: 0.29, foreArm: 0.30, hipHalf: 0.09, shoulderHalf: 0.18 };
const THIGH_ON_TABLE = -6;                     // cuisse posée à plat sur la table

// Postures du patient : tronc, cuisse et jambe droites (R) et gauches (L)
const K0 = { trunk: 92, thR: -4, shR: -88, thL: -4, shL: -88 };     // assis
const K1 = { trunk: 108, thR: 55, shR: -58, thL: 55, shL: -58 };    // genoux ramenés
const K2 = { trunk: 180, thR: 125, shR: -5, thL: 125, shL: -5 };    // sur le dos, genoux contre la poitrine
const K3 = { trunk: 180, thR: 125, shR: -5, thL: 128, shL: -8 };    // genou gauche maintenu

const MODES = {
  negatif: {
    label: 'Négatif', thigh: THIGH_ON_TABLE, shin: -91, ok: true, psoasTight: false, rfTight: false,
    title: 'Test négatif',
    text: 'La cuisse repose à plat sur la table et le genou se plie à environ 80-90°. Le psoas et le droit fémoral sont souples.'
  },
  psoas: {
    label: 'Positif psoas', thigh: 14, shin: -85, ok: false, psoasTight: true, rfTight: false,
    title: 'Test positif : psoas raide',
    text: "La cuisse reste décollée de la table : la hanche ne peut pas s'étendre complètement. Le genou, lui, se plie normalement : c'est le psoas, qui ne croise que la hanche, qui est raide."
  },
  droit: {
    label: 'Positif droit fémoral', thigh: THIGH_ON_TABLE, shin: -61, ok: false, psoasTight: false, rfTight: true,
    title: 'Test positif : droit fémoral raide',
    text: "La cuisse touche la table, mais le genou ne se plie pas jusqu'à 80-90° : la jambe part vers l'avant. Le droit fémoral, qui croise la hanche et le genou, est raide."
  }
};

const PHASES = [
  { d: 3.0, title: 'Position de départ',
    text: 'Le patient est assis tout au bout de la table, les jambes dans le vide.' },
  { d: 3.5, title: 'Genoux contre la poitrine',
    text: 'Il ramène les deux genoux contre la poitrine et commence à se pencher en arrière. Le praticien soutient son dos.' },
  { d: 3.5, title: 'Bascule sur le dos',
    text: "Il s'allonge sur le dos en gardant les deux genoux contre la poitrine." },
  { d: 3.0, title: 'Stabilisation du bassin',
    text: 'Il garde le genou gauche serré contre la poitrine : le bas du dos reste plaqué sur la table et le bassin ne bascule pas. Le praticien contrôle le genou et le bassin.' },
  { d: 4.5, title: 'Descente de la jambe testée',
    text: 'Il laisse descendre la jambe droite dans le vide, sans forcer, muscles relâchés.' },
  { d: 6.0, title: null, text: null } // lecture du test : texte selon le résultat choisi
];
const STARTS = PHASES.reduce((acc, p, i) => (acc.push(i ? acc[i - 1] + PHASES[i - 1].d : 0), acc), []);
const TOTAL = STARTS.at(-1) + PHASES.at(-1).d;

const VIEWS = {
  profil: { label: 'Profil', dir: new V3(0, 0.12, 1), dist: 3.1, target: new V3(-0.45, 0.95, 0) },
  troisquarts: { label: '3/4', dir: new V3(0.75, 0.55, 0.95), dist: 3.2, target: new V3(-0.45, 0.9, 0) },
  face: { label: 'Bout de table', dir: new V3(1, 0.3, 0.45), dist: 3.0, target: new V3(-0.45, 0.9, 0) }
};

/* ===================== Outils mathématiques ===================== */

const clamp01 = (u) => Math.min(1, Math.max(0, u));
const ease = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };
const ramp = (u, a, b) => ease((u - a) / (b - a));
const lerp = (a, b, w) => a + (b - a) * w;
const dir = (a) => new V3(Math.cos(a * DEG), Math.sin(a * DEG), 0);
const lerpPose = (a, b, w) => Object.fromEntries(Object.keys(a).map((k) => [k, lerp(a[k], b[k], w)]));

// Résout un segment à deux os (bras ou jambe) : renvoie la position du coude/genou et de l'extrémité.
function solveTwoBone(root, target, l1, l2, pole) {
  const d = target.clone().sub(root);
  let dist = d.length();
  const u = d.divideScalar(dist || 1);
  dist = Math.min(Math.max(dist, Math.abs(l1 - l2) + 1e-3), l1 + l2 - 1e-4);
  const x = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  const p = pole.clone().addScaledVector(u, -pole.dot(u));
  if (p.lengthSq() < 1e-8) p.set(0, 1, 0);
  p.normalize();
  return {
    mid: root.clone().addScaledVector(u, x).addScaledVector(p, h),
    end: root.clone().addScaledVector(u, dist)
  };
}

/* ===================== Scène ===================== */

const canvas = document.getElementById('scene');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 1.2;
controls.maxDistance = 7;
controls.maxPolarAngle = 88 * DEG;

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a939e, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(1.5, 4, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 10 });
sun.shadow.bias = -0.0005;
scene.add(sun);

const floorMat = new THREE.MeshStandardMaterial({ roughness: 1 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

function applyTheme() {
  scene.background = new THREE.Color(css('--scene'));
  floorMat.color.set(css('--floor'));
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// Table d'examen
(function buildTable() {
  const len = TABLE.end - TABLE.start;
  const cx = (TABLE.start + TABLE.end) / 2;
  const padMat = new THREE.MeshStandardMaterial({ color: 0x46566b, roughness: 0.7 });
  const frameMat = new THREE.MeshStandardMaterial({ color: 0x9aa3ad, roughness: 0.4, metalness: 0.5 });
  const pad = new THREE.Mesh(new THREE.BoxGeometry(len, 0.07, TABLE.width), padMat);
  pad.position.set(cx, TY - 0.035, 0);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(len - 0.08, 0.06, TABLE.width - 0.06), frameMat);
  frame.position.set(cx, TY - 0.1, 0);
  for (const m of [pad, frame]) { m.castShadow = m.receiveShadow = true; scene.add(m); }
  const legGeo = new THREE.CylinderGeometry(0.025, 0.025, TY - 0.13, 12);
  for (const x of [TABLE.start + 0.1, TABLE.end - 0.1]) {
    for (const z of [-0.26, 0.26]) {
      const leg = new THREE.Mesh(legGeo, frameMat);
      leg.position.set(x, (TY - 0.13) / 2, z);
      leg.castShadow = true;
      scene.add(leg);
    }
  }
})();

/* ===================== Mannequins sans visage ===================== */

function limbGeometry(r0, r1) {
  const g = new THREE.CylinderGeometry(r1, r0, 1, 20, 1, true);
  g.translate(0, 0.5, 0);
  return g;
}
const torsoGeometry = new THREE.LatheGeometry([
  [0, -0.10], [0.10, -0.095], [0.15, -0.06], [0.165, 0], [0.155, 0.10], [0.14, 0.18],
  [0.145, 0.26], [0.16, 0.34], [0.17, 0.42], [0.165, 0.47], [0.13, 0.51], [0.06, 0.535], [0, 0.54]
].map(([r, y]) => new THREE.Vector2(r, y)), 32);
const headGeometry = new THREE.SphereGeometry(0.105, 32, 24).scale(0.88, 1.12, 0.98);
const handGeometry = new THREE.SphereGeometry(0.042, 16, 12).scale(1, 1.5, 0.62).translate(0, 0.055, 0);
const footGeometry = new THREE.CapsuleGeometry(0.04, 0.15, 6, 16);
const sphere = (r) => new THREE.SphereGeometry(r, 20, 14);

const _up = new V3(0, 1, 0), _d = new V3(), _x = new V3(), _y = new V3(), _z = new V3(), _m = new THREE.Matrix4();

function setLimb(mesh, a, b) {
  _d.subVectors(b, a);
  const len = _d.length();
  mesh.position.copy(a);
  mesh.quaternion.setFromUnitVectors(_up, _d.divideScalar(len || 1));
  mesh.scale.set(1, len, 1);
}
function setOriented(mesh, pos, yDir, side) {
  _y.copy(yDir).normalize();
  _x.copy(side).addScaledVector(_y, -side.dot(_y)).normalize();
  _z.crossVectors(_x, _y);
  _m.makeBasis(_x, _y, _z);
  mesh.quaternion.setFromRotationMatrix(_m);
  mesh.position.copy(pos);
}

class Mannequin {
  constructor(color) {
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.62 });
    const add = (geo) => {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    };
    this.torso = add(torsoGeometry);
    this.torso.scale.z = 0.66;
    this.neck = add(limbGeometry(0.046, 0.042));
    this.head = add(headGeometry);
    this.sides = {};
    for (const s of ['R', 'L']) {
      this.sides[s] = {
        upperArm: add(limbGeometry(0.05, 0.042)), foreArm: add(limbGeometry(0.04, 0.031)), hand: add(handGeometry),
        thigh: add(limbGeometry(0.085, 0.058)), shin: add(limbGeometry(0.056, 0.04)), foot: add(footGeometry),
        shoulder: add(sphere(0.052)), elbow: add(sphere(0.042)), hip: add(sphere(0.08)),
        knee: add(sphere(0.058)), ankle: add(sphere(0.041))
      };
    }
  }
  pose(J) {
    setOriented(this.torso, J.pelvis, _d.subVectors(J.neck, J.pelvis).clone(), J.side);
    setLimb(this.neck, J.neck, J.neck.clone().addScaledVector(J.headDir, 0.09));
    setOriented(this.head, J.head, J.headDir, J.side);
    for (const s of ['R', 'L']) {
      const p = this.sides[s], j = J[s];
      setLimb(p.upperArm, j.shoulder, j.elbow);
      setLimb(p.foreArm, j.elbow, j.hand);
      setOriented(p.hand, j.hand, _d.subVectors(j.hand, j.elbow).clone(), J.side);
      setLimb(p.thigh, j.hip, j.knee);
      setLimb(p.shin, j.knee, j.ankle);
      setOriented(p.foot, j.heel.clone().add(j.toe).multiplyScalar(0.5), _d.subVectors(j.toe, j.heel).clone(), J.side);
      p.foot.scale.set(1.15, 1, 0.75);
      p.shoulder.position.copy(j.shoulder);
      p.elbow.position.copy(j.elbow);
      p.hip.position.copy(j.hip);
      p.knee.position.copy(j.knee);
      p.ankle.position.copy(j.ankle);
    }
  }
}

const patient = new Mannequin(0xe2cdb0);
const practitioner = new Mannequin(0x3f8f86);

/* ===================== Cinématique ===================== */

function patientJoints(k) {
  const tr = dir(k.trunk);
  const J = { pelvis: HIP.clone(), side: new V3(0, 0, 1), headDir: tr.clone() };
  J.neck = HIP.clone().addScaledVector(tr, SEG.trunk);
  J.head = J.neck.clone().addScaledVector(tr, 0.19);
  const shoulders = HIP.clone().addScaledVector(tr, SEG.shoulderUp);
  for (const [s, sign] of [['R', 1], ['L', -1]]) {
    const th = k['th' + s], sn = k['sh' + s];
    const hip = HIP.clone().add(new V3(0, 0, sign * SEG.hipHalf));
    const knee = hip.clone().addScaledVector(dir(th), SEG.thigh);
    const ankle = knee.clone().addScaledVector(dir(sn), SEG.shin);
    const footDir = dir(sn + 90 - 15);
    const sole = ankle.clone().addScaledVector(dir(sn), 0.035);
    J[s] = {
      hip, knee, ankle, thighA: th, shinA: sn,
      heel: sole.clone().addScaledVector(footDir, -0.045),
      toe: sole.clone().addScaledVector(footDir, 0.18),
      shoulder: shoulders.clone().add(new V3(0, 0, sign * SEG.shoulderHalf))
    };
  }
  return J;
}

// Point sur le devant de la jambe, juste sous le genou (là où le patient tient sa jambe)
function shinFront(leg) {
  return leg.knee.clone().addScaledVector(dir(leg.shinA), 0.09).addScaledVector(dir(leg.shinA + 90), 0.06);
}

function patientHandTarget(mode, s, J) {
  const sign = s === 'R' ? 1 : -1;
  if (mode === 'table') return new V3(HIP.x + 0.05, TY + 0.035, sign * 0.27);
  if (mode === 'hug') return shinFront(J[s]);
  const p = shinFront(J.L); // les deux mains tiennent le genou gauche
  p.z += s === 'R' ? 0.055 : -0.04;
  return p;
}
function patientElbowPole(mode, s) {
  const sign = s === 'R' ? 1 : -1;
  return mode === 'table' ? new V3(-1, 0, sign * 0.7) : new V3(-0.2, -0.6, sign);
}

function practitionerHandTarget(mode, Jp, k) {
  if (mode === 'back') {
    return Jp.pelvis.clone().addScaledVector(dir(k.trunk), 0.32).addScaledVector(dir(k.trunk + 90), 0.13).add(new V3(0, 0, -0.06));
  }
  if (mode === 'kneeTop') return Jp.L.knee.clone().add(new V3(0, 0.08, -0.03));
  // épine iliaque antéro-supérieure gauche du patient
  return Jp.pelvis.clone().addScaledVector(dir(k.trunk), 0.08).addScaledVector(dir(k.trunk - 90), 0.11).add(new V3(0, 0, -0.11));
}

const PRA = { x: -0.30, z: -0.55, hipY: 0.93 };

function practitionerJoints(lean) {
  const P = new V3(PRA.x, PRA.hipY, PRA.z - 0.1 * Math.sin(lean * DEG));
  const tr = new V3(0, Math.cos(lean * DEG), Math.sin(lean * DEG));
  const headDir = new V3(0, Math.cos((lean + 22) * DEG), Math.sin((lean + 22) * DEG));
  const J = { pelvis: P, side: new V3(1, 0, 0), headDir };
  J.neck = P.clone().addScaledVector(tr, SEG.trunk);
  J.head = J.neck.clone().addScaledVector(headDir, 0.19);
  const shoulders = P.clone().addScaledVector(tr, SEG.shoulderUp);
  for (const [s, sign] of [['R', -1], ['L', 1]]) { // la droite du praticien est vers -x
    const hip = P.clone().add(new V3(sign * 0.09, 0, 0));
    const ankle = new V3(PRA.x + sign * 0.11, 0.085, PRA.z + 0.03);
    const leg = solveTwoBone(hip, ankle, SEG.thigh, SEG.shin, new V3(0, 0, 1));
    const sole = ankle.clone().add(new V3(0, -0.045, 0));
    J[s] = {
      hip, knee: leg.mid, ankle: leg.end,
      heel: sole.clone().add(new V3(0, 0, -0.045)), toe: sole.clone().add(new V3(0, 0, 0.18)),
      shoulder: shoulders.clone().add(new V3(sign * SEG.shoulderHalf, 0, 0))
    };
  }
  return J;
}

function placeArm(J, s, target, pole) {
  const arm = solveTwoBone(J[s].shoulder, target, SEG.upperArm, SEG.foreArm, pole);
  J[s].elbow = arm.mid;
  J[s].hand = arm.end;
}

const blendTarget = (a, b, w) => a.clone().lerp(b, w);

// Calcule toute la scène à l'instant t (secondes) pour le résultat choisi
function computeScene(t, mode) {
  const m = MODES[mode];
  const K4 = { ...K3, thR: m.thigh, shR: m.shin };
  let i = PHASES.length - 1;
  while (i > 0 && t < STARTS[i]) i--;
  const u = clamp01((t - STARTS[i]) / PHASES[i].d);

  let k, patHands, praR, praL, lean;
  switch (i) {
    case 0:
      k = K0; patHands = ['table', 'table', 0]; praR = ['back', 'back', 0]; praL = ['kneeTop', 'kneeTop', 0]; lean = 18;
      break;
    case 1:
      k = lerpPose(K0, K1, ease(u)); patHands = ['table', 'hug', ramp(u, 0, 0.6)];
      praR = ['back', 'back', 0]; praL = ['kneeTop', 'kneeTop', 0]; lean = lerp(18, 20, ease(u));
      break;
    case 2:
      k = lerpPose(K1, K2, ease(u)); patHands = ['hug', 'hug', 0];
      praR = ['back', 'kneeTop', ramp(u, 0.35, 0.85)]; praL = ['kneeTop', 'asis', ramp(u, 0.3, 0.9)];
      lean = lerp(20, 28, ease(u));
      break;
    case 3:
      k = lerpPose(K2, K3, ease(u)); patHands = ['hug', 'holdL', ramp(u, 0.1, 0.8)];
      praR = ['kneeTop', 'kneeTop', 0]; praL = ['asis', 'asis', 0]; lean = 28;
      break;
    case 4: {
      // La cuisse descend d'abord, puis le genou se plie une fois passé le bord de la table
      k = lerpPose(K3, K4, ease(u));
      k.thR = lerp(K3.thR, K4.thR, ramp(u, 0, 0.7));
      k.shR = lerp(K3.shR, K4.shR, ramp(u, 0.45, 1));
      patHands = ['holdL', 'holdL', 0]; praR = ['kneeTop', 'kneeTop', 0]; praL = ['asis', 'asis', 0]; lean = 28;
      break;
    }
    default:
      k = K4; patHands = ['holdL', 'holdL', 0]; praR = ['kneeTop', 'kneeTop', 0]; praL = ['asis', 'asis', 0]; lean = 28;
  }

  const Jp = patientJoints(k);
  for (const s of ['R', 'L']) {
    const [a, b, w] = patHands;
    const target = blendTarget(patientHandTarget(a, s, Jp), patientHandTarget(b, s, Jp), w);
    const pole = blendTarget(patientElbowPole(a, s), patientElbowPole(b, s), w);
    placeArm(Jp, s, target, pole);
  }

  const Jr = practitionerJoints(lean);
  const poles = { R: new V3(-0.8, -0.6, -0.2), L: new V3(0.8, -0.6, -0.2) };
  for (const [s, plan] of [['R', praR], ['L', praL]]) {
    const target = blendTarget(practitionerHandTarget(plan[0], Jp, k), practitionerHandTarget(plan[1], Jp, k), plan[2]);
    placeArm(Jr, s, target, poles[s]);
  }

  return { phase: i, u, k, Jp, Jr };
}

/* ===================== Repères visuels (angles, muscles) ===================== */

const overlayMat = (color) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthTest: false });
function rod(radius) {
  const m = new THREE.Mesh(limbGeometry(radius, radius), overlayMat(0xffffff));
  m.renderOrder = 10;
  scene.add(m);
  return m;
}
function joint(radius) {
  const m = new THREE.Mesh(sphere(radius), overlayMat(0xffffff));
  m.renderOrder = 10;
  scene.add(m);
  return m;
}
function dashedLine() {
  const geo = new THREE.BufferGeometry().setFromPoints([new V3(), new V3(1, 0, 0)]);
  const line = new THREE.Line(geo, new THREE.LineDashedMaterial({
    color: 0x5f6b7a, dashSize: 0.035, gapSize: 0.025, transparent: true, opacity: 0, depthTest: false
  }));
  line.renderOrder = 9;
  scene.add(line);
  return line;
}
function setLine(line, a, b) {
  const pos = line.geometry.attributes.position;
  pos.setXYZ(0, a.x, a.y, a.z);
  pos.setXYZ(1, b.x, b.y, b.z);
  pos.needsUpdate = true;
  line.computeLineDistances();
}

const muscles = {
  psoas: { rods: [rod(0.013), rod(0.013)], knot: joint(0.016) },
  rf: { rods: [rod(0.013), rod(0.013)], knot: joint(0.016) }
};
const refs = { horizontal: dashedLine(), vertical: dashedLine() };

const labelBox = document.getElementById('labels');
function makeLabel() {
  const el = document.createElement('div');
  el.className = 'label';
  el.style.opacity = 0;
  labelBox.appendChild(el);
  return el;
}
const labels = { thigh: makeLabel(), knee: makeLabel() };
const legend = {
  box: document.getElementById('legend'),
  psoas: document.getElementById('lg-psoas'), psoasText: document.getElementById('lg-psoas-t'),
  rf: document.getElementById('lg-rf'), rfText: document.getElementById('lg-rf-t')
};

function setMuscle(mus, a, b, c, color, opacity) {
  setLimb(mus.rods[0], a, b);
  setLimb(mus.rods[1], b, c);
  mus.knot.position.copy(b);
  for (const m of [...mus.rods, mus.knot]) {
    m.material.color.set(color);
    m.material.opacity = opacity;
    m.visible = opacity > 0.01;
  }
}

const _p = new V3();
function placeLabel(el, pos, text, cls, opacity) {
  _p.copy(pos).project(camera);
  const visible = opacity > 0.01 && _p.z < 1;
  el.style.opacity = visible ? opacity : 0;
  if (!visible) return;
  el.textContent = text;
  el.className = 'label' + (cls ? ' ' + cls : '');
  el.style.left = ((_p.x + 1) / 2 * stage.clientWidth) + 'px';
  el.style.top = ((1 - _p.y) / 2 * stage.clientHeight) + 'px';
}

function updateOverlays(S, mode) {
  const m = MODES[mode];
  const { Jp, k, phase, u } = S;
  const R = Jp.R;
  const okColor = css('--ok'), badColor = css('--bad');

  // Angles : visibles pendant la descente de la jambe et la lecture du test
  const angleOpacity = phase === 4 ? ramp(u, 0.35, 0.7) : phase === 5 ? 1 : 0;
  setLine(refs.horizontal, R.hip, R.hip.clone().add(new V3(0.62, 0, 0)));
  setLine(refs.vertical, R.knee, R.knee.clone().add(new V3(0, -0.45, 0)));
  refs.horizontal.material.opacity = refs.vertical.material.opacity = 0.9 * angleOpacity;

  const lift = Math.round(k.thR - THIGH_ON_TABLE);
  const kneeFlex = Math.round(k.thR - k.shR);
  const thighOk = lift <= 3, kneeOk = kneeFlex >= 78;
  const final = phase === 5;
  placeLabel(labels.thigh, R.hip.clone().add(new V3(0.86, 0.02, 0.05)),
    lift <= 3 ? 'Cuisse : sur la table' : `Cuisse : décollée de ${lift}°`, final ? (thighOk ? 'ok' : 'bad') : '', angleOpacity);
  placeLabel(labels.knee, R.knee.clone().add(new V3(-0.24, -0.3, 0.05)),
    `Genou : ${kneeFlex}° de flexion`, final ? (kneeOk ? 'ok' : 'bad') : '', angleOpacity);

  // Muscles (vue « rayons X ») : vert = souple, rouge = raide
  const muscleOpacity = phase === 5 ? ramp(u, 0, 0.15) : 0;
  const tr = k.trunk, front = dir(tr - 90);
  const lumbar = Jp.pelvis.clone().addScaledVector(dir(tr), 0.22).addScaledVector(front, 0.03).add(new V3(0, 0, 0.035));
  const brim = Jp.pelvis.clone().addScaledVector(dir(tr), 0.02).addScaledVector(front, 0.08).add(new V3(0, 0, 0.07));
  const trochanter = R.hip.clone().addScaledVector(dir(k.thR), 0.1).add(new V3(0, 0, -0.02));
  setMuscle(muscles.psoas, lumbar, brim, trochanter, m.psoasTight ? badColor : okColor, muscleOpacity);

  const aiis = Jp.pelvis.clone().addScaledVector(dir(tr), 0.04).addScaledVector(front, 0.07).add(new V3(0, 0, 0.1));
  const patella = R.knee.clone().addScaledVector(dir(k.thR + 90).add(dir(k.shR + 90)).normalize(), 0.065);
  const tuberosity = R.knee.clone().addScaledVector(dir(k.shR), 0.07).addScaledVector(dir(k.shR + 90), 0.05);
  setMuscle(muscles.rf, aiis, patella, tuberosity, m.rfTight ? badColor : okColor, muscleOpacity);

  legend.box.style.opacity = muscleOpacity;
  legend.psoas.className = m.psoasTight ? 'bad' : '';
  legend.psoasText.textContent = m.psoasTight ? 'Psoas : raide' : 'Psoas : souple';
  legend.rf.className = m.rfTight ? 'bad' : '';
  legend.rfText.textContent = m.rfTight ? 'Droit fémoral : raide' : 'Droit fémoral : souple';
}

/* ===================== Interface ===================== */

const state = { t: 0, playing: true, speed: 1, mode: 'negatif', view: 'profil' };
const $ = (id) => document.getElementById(id);

function buildChoices(containerId, items, key, onPick) {
  const box = $(containerId);
  for (const [id, item] of Object.entries(items)) {
    const b = document.createElement('button');
    b.textContent = item.label;
    b.dataset.id = id;
    b.addEventListener('click', () => onPick(id));
    box.appendChild(b);
  }
}
function refreshChoices() {
  for (const b of $('modes').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.id === state.mode);
  for (const b of $('views').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.id === state.view);
}

buildChoices('modes', MODES, 'mode', (id) => {
  state.mode = id;
  // On rejoue la descente de la jambe pour voir la différence
  if (state.t > STARTS[4]) state.t = STARTS[4];
  setPlaying(true);
  refreshChoices();
});
buildChoices('views', VIEWS, 'view', (id) => { state.view = id; flyTo(id); refreshChoices(); });

function setPlaying(p) {
  state.playing = p;
  $('play').textContent = p ? '❚❚' : '▶';
  $('play').setAttribute('aria-label', p ? 'Pause' : 'Lecture');
}
$('play').addEventListener('click', () => {
  if (!state.playing && state.t >= TOTAL) state.t = 0;
  setPlaying(!state.playing);
});
$('restart').addEventListener('click', () => { state.t = 0; setPlaying(true); });
const currentPhase = () => { let i = PHASES.length - 1; while (i > 0 && state.t < STARTS[i] - 1e-6) i--; return i; };
$('prev').addEventListener('click', () => {
  const i = currentPhase();
  state.t = state.t - STARTS[i] > 0.6 ? STARTS[i] : STARTS[Math.max(0, i - 1)];
});
$('next').addEventListener('click', () => {
  const i = currentPhase();
  state.t = i < PHASES.length - 1 ? STARTS[i + 1] : TOTAL;
});
$('scrub').addEventListener('input', (e) => { state.t = e.target.value / 1000 * TOTAL; setPlaying(false); });
$('speed').addEventListener('click', () => {
  state.speed = state.speed === 1 ? 0.5 : 1;
  $('speed').textContent = state.speed === 1 ? '×1' : '×0,5';
});
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); }
});

let shownPhase = -1, shownMode = null;
function updateCaption(phase) {
  if (phase === shownPhase && state.mode === shownMode) return;
  shownPhase = phase; shownMode = state.mode;
  const m = MODES[state.mode];
  const p = PHASES[phase];
  $('cap-title').textContent = `${phase + 1}. ${p.title ?? m.title}`;
  $('cap-text').textContent = p.text ?? `${m.text} Toujours comparer avec l'autre côté.`;
  $('step-badge').textContent = `Étape ${phase + 1} / ${PHASES.length}`;
  const verdict = $('verdict');
  verdict.textContent = m.title;
  verdict.className = m.ok ? 'ok' : 'bad';
}

// Caméra : vues prédéfinies avec transition douce
let flight = null;
function viewPosition(id) {
  const v = VIEWS[id];
  const aspect = stage.clientWidth / Math.max(1, stage.clientHeight);
  const dist = v.dist * Math.max(1, 1.6 / aspect);
  return { pos: v.target.clone().addScaledVector(v.dir.clone().normalize(), dist), target: v.target.clone() };
}
function flyTo(id, instant = false) {
  const to = viewPosition(id);
  if (instant) {
    camera.position.copy(to.pos);
    controls.target.copy(to.target);
    flight = null;
    return;
  }
  flight = { t: 0, fromPos: camera.position.clone(), fromTarget: controls.target.clone(), ...to };
}
controls.addEventListener('start', () => {
  flight = null;
  state.view = null;
  refreshChoices();
  $('hint').style.opacity = 0;
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  if (state.view) flyTo(state.view, true);
  if (ready) render(); // évite une image vide après un changement de taille
}
let ready = false;
new ResizeObserver(resize).observe(stage);

/* ===================== Boucle d'animation ===================== */

function render() {
  const S = computeScene(state.t, state.mode);
  patient.pose(S.Jp);
  practitioner.pose(S.Jr);
  updateCaption(S.phase);
  $('verdict').style.opacity = S.phase === 5 ? ramp(S.u, 0, 0.12) : 0;
  $('scrub').value = Math.round(state.t / TOTAL * 1000);
  controls.update();
  updateOverlays(S, state.mode);
  renderer.render(scene, camera);
}

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (state.playing) {
    state.t += dt * state.speed;
    if (state.t >= TOTAL) { state.t = TOTAL; setPlaying(false); }
  }
  if (flight) {
    flight.t = Math.min(1, flight.t + dt / 0.8);
    const w = ease(flight.t);
    camera.position.lerpVectors(flight.fromPos, flight.pos, w);
    controls.target.lerpVectors(flight.fromTarget, flight.target, w);
    if (flight.t >= 1) flight = null;
  }
  render();
  requestAnimationFrame(frame);
}

// Paramètres d'adresse facultatifs : ?resultat=psoas&vue=face
const params = new URLSearchParams(location.search);
if (MODES[params.get('resultat')]) state.mode = params.get('resultat');
if (VIEWS[params.get('vue')]) state.view = params.get('vue');

refreshChoices();
resize();
flyTo(state.view, true);
$('loading').remove();
ready = true;
requestAnimationFrame(frame);

// Accès pour les tests automatiques et l'export vidéo
window.demo = {
  TOTAL, STARTS,
  set(t, mode = state.mode) { state.t = t; state.mode = mode; setPlaying(false); refreshChoices(); render(); },
  view(id) { state.view = id; refreshChoices(); flyTo(id, true); render(); }
};
</script>
</body>
